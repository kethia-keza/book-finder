# Append this to the bottom of /etc/haproxy/haproxy.cfg on Lb01
frontend http_front
    bind *:80
    mode http
    default_backend bookfinder_back

backend bookfinder_back
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server web01 3.10.24.92:80 check
    server web02 18.170.66.234:80 check
