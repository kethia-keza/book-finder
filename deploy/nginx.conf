server {
    listen 80 default_server;
    server_name _;
    root /var/www/book-finder;
    index index.html;

    add_header X-Served-By $hostname always;

    location /health {
        default_type application/json;
        return 200 '{"status":"ok","server":"$hostname"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
